{{- $question := copy .Page .Content "question" -}}
{{- $answer := copy .Page .Content "answer" -}}
{{- $open := get .Content "open" -}}

<details class="faq-item"{{ if $open }} open{{ end }} data-shifu-element="{{ .Content.Position }}">
    <summary class="faq-item__question">
        <span>{{ default $question "Neue Frage" }}</span>
        <span class="faq-item__icon">{{ template "icon.html" "chevron" }}</span>
    </summary>
    {{- with $answer }}<div class="faq-item__answer rich-text">{{ html . }}</div>{{ end }}
</details>

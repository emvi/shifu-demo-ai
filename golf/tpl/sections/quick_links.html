{{- $headline := copy .Page .Content "headline" -}}
{{- $overlap := get .Content "overlap" -}}

<section class="quick-links{{ if $overlap }} quick-links--overlap{{ end }}" data-shifu-element="{{ .Content.Position }}">
    <div class="container">
        {{- with $headline }}<h2 class="visually-hidden">{{ . }}</h2>{{ end }}
        <div class="quick-links__grid">
            {{ .CMS.Render .Args .Page (fmt "%s.items" .Content.Position) (index .Content.Content "items") }}
            <slot name="{{ .Content.Position }}/items"></slot>
        </div>
    </div>
</section>

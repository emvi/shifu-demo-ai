{{- $headline := copy .Page .Content "headline" -}}
{{- $autoplay := get .Content "autoplay" -}}
{{- $interval := default (get .Content "interval") "6" -}}

<section class="slider" data-component="slider"{{ if $autoplay }} data-autoplay="{{ $interval }}"{{ end }} aria-roledescription="carousel"{{ with $headline }} aria-label="{{ . }}"{{ end }} data-shifu-element="{{ .Content.Position }}">
    {{- with $headline }}<h2 class="visually-hidden">{{ . }}</h2>{{ end }}
    <div class="slider__track">
        {{ .CMS.Render .Args .Page (fmt "%s.slides" .Content.Position) (index .Content.Content "slides") }}
        <slot name="{{ .Content.Position }}/slides"></slot>
    </div>
    <div class="slider__controls">
        <button class="slider__arrow slider__arrow--prev" type="button" aria-label="Vorheriges Bild">{{ template "icon.html" "arrow-left" }}</button>
        <ol class="slider__thumbs" aria-label="Bild auswählen"></ol>
        <button class="slider__arrow slider__arrow--next" type="button" aria-label="Nächstes Bild">{{ template "icon.html" "arrow" }}</button>
    </div>
</section>

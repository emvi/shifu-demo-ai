{{- $kicker := copy .Page .Content "kicker" -}}
{{- $headline := copy .Page .Content "headline" -}}

<section class="faq" data-shifu-element="{{ .Content.Position }}">
    <div class="faq__inner">
        {{ with $kicker }}<p class="kicker">{{ . }}</p>{{ end }}
        {{ with $headline }}<h2 class="faq__headline">{{ . }}</h2>{{ end }}
        <div class="faq__list">
            {{ .CMS.Render .Args .Page (fmt "%s.items" .Content.Position) (index .Content.Content "items") }}
            <slot name="{{ .Content.Position }}/items"></slot>
        </div>
    </div>
</section>

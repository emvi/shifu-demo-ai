{{- /* Inline SVG icons. Usage: {{ template "icon.html" "arrow" }} */ -}}
{{- $name := printf "%v" . -}}
<svg class="icon icon--{{ $name }}" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{{- if eq $name "arrow" }}<path d="M5 12h14M13 6l6 6-6 6"/>
{{- else if eq $name "arrow-left" }}<path d="M19 12H5M11 6l-6 6 6 6"/>
{{- else if eq $name "chevron" }}<path d="M6 9l6 6 6-6"/>
{{- else if eq $name "external" }}<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
{{- else if eq $name "phone" }}<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>
{{- else if eq $name "mail" }}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
{{- else if eq $name "pin" }}<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>
{{- else if eq $name "calendar" }}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>
{{- else if eq $name "clock" }}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{{- else if eq $name "flag" }}<path d="M6 21V4M6 4h11l-2 4 2 4H6"/>
{{- else if eq $name "ball" }}<circle cx="12" cy="11" r="7"/><path d="M9 21h6M12 18v3"/><circle cx="10" cy="9" r=".6" fill="currentColor"/><circle cx="13" cy="8" r=".6" fill="currentColor"/><circle cx="12.5" cy="11" r=".6" fill="currentColor"/>
{{- else if eq $name "club" }}<path d="M15 3L8 18"/><path d="M8 18c-1 2-4 2.5-5 1.5 1.5-.5 3-1.5 3.5-3"/>
{{- else if eq $name "smile" }}<circle cx="12" cy="12" r="9"/><path d="M8 14a5 5 0 0 0 8 0M9 9h.01M15 9h.01"/>
{{- else if eq $name "users" }}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>
{{- else if eq $name "info" }}<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>
{{- else if eq $name "play" }}<path d="M8 5l11 7-11 7z" fill="currentColor"/>
{{- else if eq $name "close" }}<path d="M6 6l12 12M18 6L6 18"/>
{{- else if eq $name "menu" }}<path d="M4 7h16M4 12h16M4 17h16"/>
{{- else if eq $name "cart" }}<path d="M3 16h13l3-7H8"/><circle cx="8" cy="19" r="1.6"/><circle cx="16" cy="19" r="1.6"/><path d="M5 16V5H2"/>
{{- else if eq $name "download" }}<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
{{- else if eq $name "check" }}<path d="M5 12l5 5 9-10"/>
{{- else }}<circle cx="12" cy="12" r="3"/>
{{- end }}
</svg>

{{- $label := copy .Page .Content "label" -}}
{{- $href := copy .Page .Content "href" -}}
{{- $icon := get .Content "icon" -}}
{{- $newTab := get .Content "new_tab" -}}

<li class="link-item{{ with $icon }} link-item--icon{{ end }}" data-shifu-element="{{ .Content.Position }}">
    {{- with $icon }}{{ template "icon.html" . }}{{ end }}
    {{- if $href }}
    <a class="link-item__link" href="{{ $href }}"{{ if $newTab }} target="_blank" rel="noopener"{{ end }}>{{ $label }}</a>
    {{- else }}
    <span class="link-item__text">{{ $label }}</span>
    {{- end }}
</li>

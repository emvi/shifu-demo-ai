{{- $headline := copy .Page .Content "headline" -}}
{{- $text := copy .Page .Content "text" -}}

<div class="footer-column" data-shifu-element="{{ .Content.Position }}">
    {{- with $headline }}<h3 class="footer-column__title">{{ . }}</h3>{{ end }}
    {{- with $text }}<div class="footer-column__text rich-text">{{ html . }}</div>{{ end }}
    <ul class="footer-column__links">
        {{ .CMS.Render .Args .Page (fmt "%s.links" .Content.Position) (index .Content.Content "links") }}
        <slot name="{{ .Content.Position }}/links"></slot>
    </ul>
</div>
